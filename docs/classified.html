<!DOCTYPE html>

<style>
:root{--r:#ff1744;--g:#00ff9c;--m:#9a6b73;--mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:#0a0102;color:#ffd9df;font:14px/1.7 var(--mono),Tahoma,sans-serif;padding:18px 14px 50px;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.35;pointer-events:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000045 2px 3px),radial-gradient(ellipse,transparent 55%,#000000d0)}
main{position:relative;z-index:2;max-width:560px;margin:0 auto}
a.back{color:var(--g);text-decoration:none;font-size:12px;letter-spacing:2px;display:inline-block;margin-bottom:16px}

@keyframes fl{0%,92%,100%{transform:none}94%{transform:translateX(4px);text-shadow:-3px 0 var(--r),3px 0 #00e5ff}}
.sub{color:var(--m);font-size:12px;letter-spacing:2px;min-height:20px}
.stamp{display:inline-block;margin:14px 0 20px;padding:6px 16px;border:3px solid var(--r);color:var(--r);font-weight:900;letter-spacing:6px;transform:rotate(-4deg);animation:st 1s cubic-bezier(.2,2,.4,1) both;text-shadow:0 0 10px var(--r);box-shadow:0 0 18px -4px var(--r) inset,0 0 18px -4px var(--r)}
@keyframes st{from{transform:scale(3) rotate(-14deg);opacity:0}}
.f{position:relative;margin:0 0 14px;padding:16px 16px 14px;border:1px solid #ff174455;border-radius:10px;background:linear-gradient(180deg,#1a0409e6,#0c0205f0);overflow:hidden;animation:in .6s both}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
.f::before{content:"";position:absolute;left:0;right:0;top:-40%;height:40%;background:linear-gradient(transparent,#ff17441c,transparent);animation:ts 4s linear infinite}@keyframes ts{to{top:130%}}
.f b{color:var(--r);letter-spacing:2px;font-size:12px}.f h2{margin:4px 0 8px;font-size:16px;letter-spacing:2px;color:#fff}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--m);margin-bottom:10px}.meta i{font-style:normal;color:var(--g)}
.red{cursor:pointer;display:block;background:#000;color:#000;border-radius:3px;padding:2px 8px;user-select:none;transition:.35s;border:1px solid #ff174433;background-image:repeating-linear-gradient(45deg,#16070b 0 6px,#000 6px 12px)}
.red.open{background:transparent;color:var(--g);border-color:var(--g);user-select:text;text-shadow:0 0 8px var(--g)}
.hint{font-size:10px;color:var(--m);margin-top:6px;letter-spacing:1px}
.foot{margin-top:26px;text-align:center;color:var(--m);font-size:11px;letter-spacing:2px}
